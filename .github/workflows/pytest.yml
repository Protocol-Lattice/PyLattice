name: PyLattice tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and tests
        run: python -m pip install -e . "pytest>=8,<10" "pytest-asyncio>=0.25,<2" "ruff>=0.11,<1"
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Lint Code Mode changes
        run: |
          python -m ruff check src/agent_tui/agent.py src/agent_tui/codemode.py \
            src/agent_tui/context.py src/agent_tui/defaults.py src/agent_tui/loop.py \
            src/agent_tui/policy.py src/agent_tui/prompts.py src/agent_tui/tools.py \
            tests/test_agent.py tests/test_codemode.py tests/test_repository_context.py \
            tests/test_tools.py benchmarks/benchmark_repository_context.py
      - name: Run regression suite
        run: python -m pytest -q
      - name: Benchmark cold vs indexed repository scans
        run: python benchmarks/benchmark_repository_context.py
